name: Publish release catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
  schedule:
    # Refresh the NEXUS policy's publication window; the allowlist stays reviewed.
    - cron: '17 */6 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Release events only dispatch a run on main. Publishing runs are serialized.
concurrency:
  group: release-catalog-${{ github.event_name == 'release' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  request-sync:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Run the current catalog workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-catalog.yml --repo "$GITHUB_REPOSITORY" --ref main

  validate:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate warning and blocking policy
        run: python3 scripts/validate_policy.py
      - name: Preserve approved legacy TRACER policy
        run: python3 scripts/validate_legacy_policy.py
      - name: Validate NEXUS composition policy
        run: python3 scripts/generate_nexus_policy.py --check
      - name: Test release synchronization
        run: python3 -m unittest discover -s tests -v
      - name: Require validated workflow publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! TRACER_PAGES_BUILD_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type'); then
            echo '::error::Cannot verify Pages configuration. The repository owner must grant Pages read access and confirm Source is GitHub Actions.'
            exit 1
          fi
          if [ "$TRACER_PAGES_BUILD_TYPE" != 'workflow' ]; then
            echo '::error::Pages can bypass these checks. The repository owner must set Settings > Pages > Source to GitHub Actions.'
            exit 1
          fi

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Test the main revision being published
        run: |
          python3 scripts/validate_policy.py
          python3 scripts/validate_legacy_policy.py
          python3 scripts/generate_nexus_policy.py --check
          python3 -m unittest discover -s tests -v
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Recheck Pages publishing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TRACER_PAGES_BUILD_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$TRACER_PAGES_BUILD_TYPE" != 'workflow' ]; then
            echo '::error::Pages Source must remain GitHub Actions; refusing deployment.'
            exit 1
          fi
      - name: Refresh downloads without changing legacy policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add // []' > "$RUNNER_TEMP/tracer-releases.json"
          python3 scripts/sync_releases.py \
            --releases "$RUNNER_TEMP/tracer-releases.json" \
            --repository "$GITHUB_REPOSITORY" \
            --catalog-only
          python3 scripts/validate_legacy_policy.py
      - name: Commit changed metadata
        run: |
          git add executables.json README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update executable release catalog'
            git push origin HEAD:main
          fi
      - name: Stage protected legacy files and current NEXUS policy
        run: |
          POLICY_MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$POLICY_MAIN_SHA"
          test "$POLICY_MAIN_SHA" = "$(git rev-parse HEAD)"
          python3 scripts/prepare_site.py --output _site
      - name: Validate the exact staged publication
        run: python3 scripts/prepare_site.py --output _site --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Refuse publishing a superseded policy revision
        run: |
          POLICY_MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$POLICY_MAIN_SHA"
          test "$POLICY_MAIN_SHA" = "$(git rev-parse HEAD)"
          python3 scripts/prepare_site.py --output _site --check
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
